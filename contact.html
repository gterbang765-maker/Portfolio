    <main>

        <section class="page-section">

            <h1>Contact Me</h1>

            <form id="contactForm">

                <label for="name">Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                >

                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                >

                <label for="message">Message</label>
                <textarea
                    id="message"
                    name="message"
                    rows="5"
                    placeholder="Write your message"
                ></textarea>

                <button type="submit">
                    Send Message
                </button>

            </form>

            <p id="formMessage"></p>

        </section>

    </main>
